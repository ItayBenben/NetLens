# Free cloud build of NetLens Lite on GitHub's macOS machines.
# Produces an UNSIGNED .ipa. Sign and install it from Windows with Sideloadly (see FREE_INSTALL.md).
name: Build NetLens Lite

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NetLens.xcodeproj \
            -target NetLensLite \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/NetLensLite.app Payload/
          zip -qry NetLensLite.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NetLensLite-ipa
          path: NetLensLite.ipa
          retention-days: 30
